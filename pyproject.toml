[project]
name = "h2o"
version = "0.1.0"
description = "h2o — a human-authored SKOS vocabulary as the entity layer (workspace root)"
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/agent", "apps/api", "packages/h2o_core"]

[dependency-groups]
dev = [
  "ruff>=0.14.0",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "uvicorn[standard]>=0.34",
  "cfn-lint>=1.22",
  # The vocabulary and corpus gates in scripts/ run under the workspace
  # interpreter now that they import h2o_core, so their dependencies are the
  # workspace's rather than a --with flag on the make target.
  "pyshacl>=0.30",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_unused_configs = true
warn_no_return = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "strands.*",
  "bedrock_agentcore.*",
  "boto3.*",
  "botocore.*",
  "mangum.*",
  "pyoxigraph.*",
  "pyshacl.*",
  "rdflib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/h2o_core/tests", "apps/agent/tests", "apps/api/tests"]
# The apps are `package = false`, so they are never installed; putting their
# directories on the path is what lets the test suites import them.
pythonpath = ["apps/agent", "apps/api"]
# importlib import mode, so the two suites may both hold a test_gaps.py. Under
# the default prepend mode a shared basename across un-packaged test directories
# is a collection error, and "rename the file" would make pytest's import
# mechanics decide what a test is called.
addopts = "-q --import-mode=importlib"
# The integrity gate costs ~11s of pySHACL per call, so tests that need the
# real one say so and the rest stub it. See test_publish's autouse fixture:
# paying it eighteen times to assert things about ETags bought no coverage
# and took `make check` to ten minutes.
markers = ["real_gate: runs the real SHACL + parity gate rather than a stub"]
asyncio_mode = "auto"
